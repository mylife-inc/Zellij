title: "Capabilities — PayOS"
description: "Providers, hosted pages, licensing, subscriptions, the customer portal, vendor integration, analytics, and the security posture behind them."
layout: stack-sidebar
navHighlight: capabilities
sections:
  - type: hero
    headline: "Every capability, and what it replaces"
    subhead: "Each of these exists because the alternative is undifferentiated engineering you would otherwise maintain forever."

  - type: feature-grid
    id: providers
    heading: "12 payment providers, one dashboard"
    subhead: "Every provider lives behind one common interface."
    columns: 3
    items:
      - icon: mouse-pointer-click
        title: "One-click OAuth"
        body: "Stripe, PayPal, Square, and Mollie connect through the provider's own hosted flow, which handles account creation, KYC, and bank details. Credentials return to PayOS automatically."
      - icon: list-checks
        title: "Guided setup for the rest"
        body: "A step-by-step wizard links you to the provider's signup, tells you exactly where to find each key, and validates the credentials server-side before saving."
      - icon: layers
        title: "Multiple providers per product"
        body: "Offer card *and* PayPal *and* crypto on the same checkout; the buyer picks."

  - type: showcase
    id: hosted
    eyebrow: "Hosted pricing & checkout"
    headline: "Zero payment code on your website"
    body: "Every product gets a public, vendor-branded pricing page and checkout at a stable URL. No SDKs, no card fields, and no PCI DSS audit scope beyond SAQ-A. Branded with your logo, banner, and accent colour."
    background: tinted

  - type: feature-grid
    id: licensing
    heading: "Licensing & anti-piracy"
    subhead: "Payment, key issuance, machine-capped validation, and revoke-on-refund as one atomic pipeline."
    columns: 2
    items:
      - icon: key-round
        title: "Key issuance on confirmed payment"
        body: "Never on a redirect — a browser redirect is not proof of payment."
      - icon: monitor-check
        title: "Machine-activation caps"
        body: "A per-product limit on how many machines a key can run on, with online validation."
      - icon: wifi-off
        title: "Signed offline-grace receipts"
        body: "Ed25519-signed, so a customer's software keeps working through a network outage."
      - icon: undo-2
        title: "Revoke, and revoke-on-refund"
        body: "Revoke a key by hand, or let a refund do it automatically. Customers can self-serve the 'I got a new laptop' flow."

  - type: feature-grid
    id: portal
    heading: "The customer portal and your backend"
    columns: 2
    items:
      - icon: mail
        title: "Magic-link portal"
        body: "Passwordless and vendor-branded. Buyers see purchases and receipts, reveal and copy keys, manage machines, and cancel subscriptions."
      - icon: webhook
        title: "Signed outbound webhooks"
        body: "PayOS POSTs a signed event the moment it happens — `checkout.completed`, `subscription.renewed`, `license.issued`, `refund.succeeded` — so you never poll."
      - icon: code
        title: "Query API with scoped keys"
        body: "Create checkouts, read subscriptions and licenses, revoke a key."
      - icon: shield-check
        title: "Entitlement checks"
        body: "A single 'does this customer have access right now?' call your backend can lean on if it ever misses a webhook."

  - type: showcase
    id: analytics
    eyebrow: "Analytics"
    headline: "One view of your whole business"
    body: "Revenue, refunds, customers, subscribers, and MRR — sliced by period, country, product, and provider, with a per-currency breakdown of gross, refunded, and net. No single provider dashboard can show you this, because no single provider sees all your sales."

  - type: feature-grid
    id: security
    heading: "Security, environments, and self-hosting"
    columns: 3
    items:
      - icon: lock
        title: "Encrypted at rest"
        body: "Provider credentials sealed with AES-256-GCM, secrets hashed, and every inbound and outbound webhook signature-verified."
      - icon: split
        title: "Test and live, fully separated"
        body: "Test data can never leak into a live figure or listing."
      - icon: server
        title: "One-command self-host"
        body: "The same container images run locally via Docker and on Railway, AWS, GCP, or DigitalOcean."

  - type: cta-banner
    headline: "Try it against the mock provider"
    body: "No real account needed to see the whole pipeline work."
    cta:
      - { label: "Getting started", href: /guide/getting-started, style: primary }
