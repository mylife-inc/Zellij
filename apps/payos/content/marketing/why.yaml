title: "Why PayOS"
description: "The problem, the pitch, and the honest boundaries — why payments, licensing, and customer plumbing should be built once rather than once per product."
layout: stack-narrow
navHighlight: why-payos
sections:
  - type: hero
    headline: "PayOS does the payments plumbing once"
    subhead: "So every product you ship doesn't have to."

  - type: markdown-prose
    id: problem
    heading: "The problem"
    body: |
      You have a product to sell. Before a single dollar arrives, you have to build:

      - a **pricing page**, and keep it in sync with your plans;
      - a **checkout** that handles cards, wallets, bank methods, and maybe crypto;
      - an **integration with each payment provider** — different API, different
        webhooks, different quirks, for *every* provider you want to accept;
      - **webhook verification, deduplication, and retries**, because a browser
        redirect is never proof of payment;
      - a **license server** if you sell downloadable software and don't want it pirated;
      - a **customer portal** so buyers can find their receipts and license keys
        without emailing you;
      - **refunds, subscription management, dunning**, and
      - **analytics** to know whether any of it is working.

      Then you finish, ship your second product, and **build it all again**. And
      every provider you add later is another integration project.

      That is weeks-to-months of undifferentiated engineering per product — none
      of it the thing your customers actually pay you for.

  - type: markdown-prose
    id: how
    heading: "How PayOS does it once"
    body: |
      Describe your product in PayOS **one time**. In return you get a hosted
      pricing page, a hosted checkout wired to every provider you've connected,
      license issuance, a customer portal, webhooks, refunds, and analytics — for
      that product and every future one. Your website's only job is a
      **redirect link**.

      <Callout type="info" title="Orchestrator, not merchant of record">
      You connect your own provider accounts, funds settle directly with you, and
      PayOS never touches the money. That means no money-transmitter licensing on
      our side, minimal PCI scope on yours, and no lock-in of your funds or your
      customers. PayOS is replaceable plumbing, never a custodian.
      </Callout>

  - type: showcase
    id: honest
    eyebrow: "The honest note"
    headline: "Real providers need real accounts"
    body: "Connecting a live provider requires that provider's own merchant account — that is normal, and it is what keeps your money yours. You can run and demo the entire platform with the built-in mock provider first, with no real account needed."
    background: tinted

  - type: stats-band
    heading: "What that replaces"
    stats:
