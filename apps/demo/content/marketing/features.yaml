title: "Features — Acme"
description: "Workflows, approvals, reporting, and security features that make Acme the system of record for your operation."
layout: stack-sidebar
navHighlight: features
sections:
  - type: hero
    headline: "Every capability, in one platform"
    subhead: "The building blocks teams use to run their operation on Acme."
    cta:
      - { label: "Start free", href: /guide/quickstart, style: primary }
    visualStyle: framed

  - type: feature-grid
    id: workflows
    heading: "Workflows"
    columns: 3
    items:
      - { icon: workflow, title: "Visual builder", body: "Drag-and-drop process design with branching and parallel paths." }
      - { icon: timer, title: "SLA tracking", body: "Set targets per step and escalate automatically when they slip." }
      - { icon: repeat, title: "Recurring runs", body: "Schedule processes daily, weekly, or on a custom cadence." }

  - type: zigzag
    id: reporting
    heading: "Reporting"
    rows:
      - title: "Dashboards that stay current"
        body: "Every chart reads live platform state, so the number you see is the number that is true right now."
        image: assets/shot-reporting.png
        align: image-right
      - title: "Export anything"
        body: "Scheduled CSV and API exports feed your warehouse without a custom pipeline."
        image: assets/shot-export.png
        align: image-left

  - type: showcase
    id: security
    eyebrow: "Security & compliance"
    headline: "Enterprise controls without the enterprise slog"
    body: "SSO, SCIM provisioning, field-level permissions, immutable audit logs, and configurable data retention. Self-host to keep every byte in your own cloud."
    visual: assets/showcase-security.png
    background: inverted

  - type: faq
    id: faq
    heading: "Common questions"
    items:
      - question: "Can we self-host Acme?"
        answer: "Yes. The full stack deploys into your own cloud account with the same feature set as our hosted offering."
      - question: "How long does migration take?"
        answer: "Most teams move their first workflow in a day and complete migration within a month."
      - question: "Do you support SSO?"
        answer: "SAML and OIDC are supported on all paid plans, with SCIM provisioning on Enterprise."

  - type: cta-banner
    headline: "See Acme on your own workflow"
    cta: { label: "Read the quickstart", href: /guide/quickstart, style: primary }
