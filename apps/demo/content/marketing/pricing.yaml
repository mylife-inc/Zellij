title: "Pricing — Acme"
description: "Simple per-seat pricing with a free tier to start and self-hosting available on every paid plan."
layout: stack
navHighlight: pricing
sections:
  - type: hero
    headline: "Pricing that scales with your team"
    subhead: "Start free. Upgrade when your operation outgrows it."
    visualStyle: framed

  - type: pricing-table
    id: plans
    # Per-section override (spec §6.5): pricing stays still on an otherwise
    # animated page, so the numbers are readable the instant they appear.
    motion: none
    heading: "Plans"
    subhead: "Every plan includes unlimited workflows and the full integration library."
    tiers:
      - name: Starter
        price: "$0"
        period: "forever"
        description: "For small teams proving out a first process."
        features:
          - "Up to 5 users"
          - "3 active workflows"
          - "Community support"
        cta: { label: "Get started", href: /guide/quickstart, style: secondary }
      - name: Team
        price: "$24"
        period: "per user / month"
        description: "For operations teams running the business day to day."
        features:
          - "Unlimited workflows"
          - "SLA tracking and escalation"
          - "SSO (SAML & OIDC)"
          - "Priority support"
        highlighted: true
        cta: { label: "Start free trial", href: /guide/quickstart, style: primary }
      - name: Enterprise
        price: "Custom"
        description: "For regulated operations and self-hosted deployments."
        features:
          - "Everything in Team"
          - "Self-hosted deployment"
          - "SCIM provisioning"
          - "Dedicated success manager"
        cta: { label: "Talk to us", href: /about, style: secondary }

  - type: faq
    heading: "Billing questions"
    items:
      - question: "Is there a free trial on paid plans?"
        answer: "Yes — 14 days on Team, no card required."
      - question: "Do you offer nonprofit pricing?"
        answer: "We do. Reach out and we will sort it."

  - type: cta-banner
    headline: "Still deciding?"
    body: "The Starter plan is free forever and takes ten minutes to set up."
    cta: { label: "Get started", href: /guide/quickstart, style: primary }
