title: "Acme — The operations platform your team already knows how to use"
description: "Acme unifies your workflows, approvals, and reporting into one system your whole company can actually run."
layout: landing
sections:
  - type: hero
    badge: "Acme 2.0 is here"
    headline: "The operations platform your team already knows how to use"
    subhead: "Unify workflows, approvals, and reporting in one place. Run it as SaaS or deploy the whole stack in your own cloud."
    cta:
      - { label: "Get started", href: /guide/quickstart, style: primary }
      - { label: "See features", href: /features, style: ghost }
    visual: assets/hero-dashboard.png
    visualStyle: floating

  - type: logo-strip
    heading: "Trusted by operations teams at"
    logos:
      - assets/logos/northwind.svg
      - assets/logos/globex.svg
      - assets/logos/initech.svg
      - assets/logos/umbrella.svg

  - type: feature-grid
    id: capabilities
    heading: "Everything your operation needs"
    subhead: "One platform instead of six tools and a spreadsheet."
    columns: 3
    items:
      - { icon: refresh-cw, title: "Automated reconciliation", body: "Match records across every connected system, continuously." }
      - { icon: shield-check, title: "Compliance built in", body: "Audit trails, retention policies, and approvals out of the box." }
      - { icon: workflow, title: "Visual workflows", body: "Design approval chains without writing a line of code." }
      - { icon: bar-chart-3, title: "Live reporting", body: "Dashboards that update as work happens, not overnight." }
      - { icon: plug, title: "200+ integrations", body: "Connect the tools your team already uses." }
      - { icon: lock, title: "Self-hostable", body: "Deploy the full stack inside your own cloud account." }

  - type: zigzag
    rows:
      - title: "See every process in one view"
        body: "Stop stitching together status from email threads. Acme shows the state of every workflow, owner, and deadline on a single board."
        image: assets/shot-workflows.png
        align: image-right
      - title: "Approvals that actually move"
        body: "Route work by rule, escalate on delay, and give approvers one-click context. No more chasing."
        image: assets/shot-approvals.png
        align: image-left

  - type: stats-band
    stats:
      - { value: "40%", label: "Less time on manual review" }
      - { value: "12k", label: "Workflows run daily" }
      - { value: "99.99%", label: "Platform uptime" }
      - { value: "200+", label: "Integrations" }

  - type: showcase
    id: platform
    eyebrow: "The platform"
    headline: "Built for the way operations really work"
    body: "Acme adapts to your process instead of forcing a rewrite. Start with one workflow, expand to the whole company."
    visual: assets/showcase-platform.png
    background: inverted
    cta: { label: "Read the guide", href: /guide, style: secondary }

  - type: testimonial
    quotes:
      - quote: "We replaced four tools and a very tired spreadsheet. Onboarding took an afternoon."
        author: "Dana Whitfield"
        role: "VP Operations, Northwind"
        avatar: assets/avatars/dana.png
      - quote: "The audit trail alone justified the switch. Our compliance review went from weeks to days."
        author: "Samir Haddad"
        role: "Head of Risk, Globex"
        avatar: assets/avatars/samir.png

  - type: cta-banner
    headline: "Ready to see it on your own process?"
    body: "Set up your first workflow in about ten minutes."
    cta:
      - { label: "Get started", href: /guide/quickstart, style: primary }
      - { label: "Compare plans", href: /pricing, style: ghost }
