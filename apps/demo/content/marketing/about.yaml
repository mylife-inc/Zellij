title: "About — Acme"
description: "Why we build Acme, who we build it for, and how to reach the team."
layout: stack-narrow
sections:
  - type: markdown-prose
    id: story
    heading: "Why we build Acme"
    body: |
      Operations teams are the connective tissue of a company, and they are
      almost always working in tools built for someone else — a project tracker
      bent into an approval queue, a spreadsheet doing the job of a database.

      We started Acme because that gap never closed. The work is real, repeated,
      and high-stakes, and it deserves a system designed for it rather than
      borrowed from an adjacent problem.

      Today Acme runs workflows for teams in logistics, healthcare, and financial
      services — the places where "we think it was approved" is not an acceptable
      answer.

