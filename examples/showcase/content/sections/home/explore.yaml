type: card-carousel
id: explore
heading: Why teams pick Acme
link: { label: Browse the guide, href: /guide }
cardWidth: medium
titleGradient: [accent, fg]
items:
  - eyebrow: Workflows
    title: Route work the way your team already works.
    body: Branches, parallel steps and conditions, without a scripting language.
    image: assets/card-workflows.png
    href: /features#workflows

  - eyebrow: Approvals
    title: Sign-off that leaves a trail.
    body: Every decision recorded with who, when and on what version.
    image: assets/card-approvals.png
    href: /features#workflows

  - eyebrow: Reporting
    title: Answers without an analyst.
    body: Ask in plain language, save the view, share the link.
    image: assets/card-reporting.png
    href: /features#reporting

  - eyebrow: Audit
    title: Ready before the auditor asks.
    body: Immutable history, exportable in the formats reviewers accept.
    image: assets/card-audit.png
    href: /features#security

  - eyebrow: API
    title: Everything the UI does, over HTTP.
    body: One token, one base URL, and a typed client for six languages.
    image: assets/card-api.png
    href: /guide/config/overview
