type: pricing-table
id: plans
motion: none
heading: Plans
subhead: Every plan includes unlimited workflows and the full integration library.
tiers:
  - name: Starter
    price: $0
    period: forever
    description: For small teams proving out a first process.
    features:
      - Up to 5 users
      - 3 active workflows
      - Community support
    cta:
      label: Get started
      href: /guide/quickstart
      style: secondary
  - name: Team
    price: $24
    period: per user / month
    description: For operations teams running the business day to day.
    features:
      - Unlimited workflows
      - SLA tracking and escalation
      - SSO (SAML & OIDC)
      - Priority support
    highlighted: true
    cta:
      label: Start free trial
      href: /guide/quickstart
      style: primary
  - name: Enterprise
    price: Custom
    description: For regulated operations and self-hosted deployments.
    features:
      - Everything in Team
      - Self-hosted deployment
      - SCIM provisioning
      - Dedicated success manager
    cta:
      label: Talk to us
      href: /about
      style: secondary
