type: timeline
id: history
heading: The story so far
subhead: Four people and a spreadsheet, then everything that followed.
items:
  - date: 2019
    title: A spreadsheet that would not die
    body: Acme started as an internal tool for one operations team who had outgrown every workaround they had.
    icon: sprout
    image: assets/timeline-first.png
  - date: 2021
    title: The first customer who was not us
    body: A logistics company asked whether they could buy it. We said yes before we had a way to bill them.
    icon: handshake
  - date: 2023
    title: Self-hosting, because regulators asked
    body: The same images, on your own cloud, with the audit trail reviewers actually accept.
    icon: server
  - date: 2026
    title: Acme 2.0
    body: A rebuilt workflow engine, an API that mirrors the UI exactly, and reporting anyone can use.
    icon: rocket
