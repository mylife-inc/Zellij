type: faq
id: faq
heading: Reasonable questions
items:
  - question: Is this a static site generator?
    answer: >-
      Yes. The `zel` CLI builds portable Markdown documentation or rich
      websites from structured content. The shared Next.js engine can also
      be used in an editable wrapper application. Choose the output that
      matches how you want to distribute the site.
  - question: Do I have to write React?
    answer: >-
      No. Start from a website or book template with `zel create`, then edit
      YAML and Markdown. The CLI handles the build; an editable Next.js
      wrapper is available when you need application-level customization.
  - question: What if I already have MkDocs content?
    answer: >-
      Use `zel convert` to import the documentation and navigation. MkDocs,
      Docusaurus, VitePress, Jekyll, Hugo and Sphinx have dedicated importers.
      Review the conversion report for extensions or dynamic configuration
      that need manual changes.
  - question: Can I add my own section type?
    answer: >-
      Yes — `registerSection` takes a schema and a component. Built-ins use the
      same registry, so a custom section is not a second-class one.
  - question: What happens when content is wrong?
    answer: >-
      The build fails, loudly, naming the file, the path inside it, and what
      was expected. A broken nav link or a missing section file is a build
      error, not something a visitor discovers.
