# Publishes the Zellij base image to GHCR.
#
# The image is public even though this repository is not: it is how Zellij is
# distributed to people who cannot clone the source. Nothing secret goes into
# it — the engine is shipped as its build output, and the layer holding it is
# the same layer everyone else pulls.
name: Base image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: base-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/zellij-base

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # One Dockerfile, four images. The features only change which optional
    # dependencies the generated package.json asks for, so the variants cost
    # almost nothing to publish and save a site build from fetching a hundred
    # megabytes of diagram library it has no diagrams for.
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: none
            suffix: ''
          - features: maths
            suffix: '-maths'
          - features: diagrams
            suffix: '-diagrams'
          - features: all
            suffix: '-all'

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base.Dockerfile
          build-args: |
            ZELLIJ_FEATURES=${{ matrix.features }}
          # arm64 as well as amd64: a lot of authors are on Apple silicon, and
          # emulating the wrong architecture locally turns a fast build slow.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only the default variant is smoke-tested: the others differ by three
      # lines of JSON, and building four sites to learn the same thing is time
      # every push would pay for.
      # `meta.outputs.version` is the primary tag that was just pushed, not the
      # ref it came from. On a branch those are the same word; on a tag they
      # are not — `metadata-action` publishes semver without the leading `v`,
      # so `v0.1.0-rc.2` here asked for an image nobody had pushed and the
      # build failed in one second on a manifest that does not exist.
      - name: Prove the image can build a site
        if: matrix.features == 'none'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # `--progress plain` because the default collapses the output of the
          # step that fails, and a truncated failure costs a whole round trip
          # to reproduce.
          if ! docker build --progress plain \
            --build-arg ZELLIJ_VERSION="$VERSION" \
            --build-arg CONTENT=examples/payos/content \
            -f docker/site.Dockerfile -t zellij-smoke .
          then
            echo "::group::What the image actually received"
            # A previous failure claimed the payos sidebar referenced pages
            # that did not exist, on content that validates everywhere else.
            # If it happens again, the answer is either in this listing or in
            # the checker's own view of the same folder — and both are one
            # command away, rather than a day of not reproducing it.
            docker run --rm -v "$PWD/examples/payos/content:/c:ro" \
              "${REGISTRY}/${IMAGE}:${VERSION}" sh -c 'ls -la /c /c/01-guide' || true
            docker run --rm -v "$PWD/examples/payos/content:/c:ro" \
              "${REGISTRY}/${IMAGE}:${VERSION}" \
              node /opt/zellij/bin/zellij.mjs check /c || true
            echo "::endgroup::"
            exit 1
          fi
          docker run -d --name smoke -p 3000:3000 zellij-smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then echo "serving"; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1
