# Publishes the Zellij base image to GHCR.
#
# The image is public even though this repository is not: it is how Zellij is
# distributed to people who cannot clone the source. Nothing secret goes into
# it — the engine is shipped as its build output, and the layer holding it is
# the same layer everyone else pulls.
#
# Each architecture is built on a runner of that architecture and the results
# are stitched into one manifest. Building both on an amd64 runner meant
# emulating arm64 through QEMU, and QEMU running Node crashed:
#
#     [linux/arm64 engine 4/5] RUN npm ci --ignore-scripts
#     qemu: uncaught target signal 4 (Illegal instruction)
#
# Intermittently, and in a different variant each time, so it read like flaky
# infrastructure rather than the one deterministic thing it is: emulated
# execution of a JIT. Native runners remove the emulator and most of the
# build time with it.
name: Base image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: base-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/zellij-base

jobs:
  # --------------------------------------------------------------- per arch
  # Pushed by digest rather than by tag: a tag can only point at one thing, and
  # two jobs racing to claim it would leave whichever finished last. The digests
  # are collected and named in one place, below.
  build:
    name: ${{ matrix.features }} · ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        # One Dockerfile, four images. The features only change which optional
        # dependencies the generated package.json asks for, so the variants cost
        # almost nothing to publish and save a site build from fetching a
        # hundred megabytes of diagram library it has no diagrams for.
        features: [none, maths, diagrams, all]
        platform:
          - { arch: amd64, name: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, name: linux/arm64, runner: ubuntu-24.04-arm }

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base.Dockerfile
          platforms: ${{ matrix.platform.name }}
          build-args: |
            ZELLIJ_FEATURES=${{ matrix.features }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.features }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.features }}-${{ matrix.platform.arch }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.features }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # ------------------------------------------------------------------ manifest
  merge:
    name: Publish ${{ matrix.features }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - { features: none, suffix: '' }
          - { features: maths, suffix: '-maths' }
          - { features: diagrams, suffix: '-diagrams' }
          - { features: all, suffix: '-all' }

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.features }}-*
          merge-multiple: true

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Everything this step depends on, before it depends on it. Two runs
      # failed here with eight green builds above them, and a bare
      # `imagetools create` says nothing about which of its three inputs — the
      # digests, the tags, the registry — was the problem.
      - name: What the manifest will be built from
        working-directory: /tmp/digests
        run: |
          echo "::group::Digests downloaded"
          ls -la
          echo "::endgroup::"

          echo "::group::Tags metadata-action produced"
          jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"
          echo "::endgroup::"

          if [ -z "$(ls -A)" ]; then
            echo "::error::No digest files. The build jobs uploaded none, or the download pattern matched none."
            exit 1
          fi

      - name: Stitch the architectures into one manifest
        working-directory: /tmp/digests
        run: |
          set -x
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)

      - name: Show what was published
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${VERSION}"

  # --------------------------------------------------------------- smoke test
  # Only the default variant: the others differ by three lines of JSON, and
  # building four sites to learn the same thing is time every push would pay.
  smoke:
    name: The image can build a site
    needs: merge
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build a site from it
        env:
          # The tag just published, not the ref it came from: on a tag push
          # `metadata-action` publishes semver without the leading `v`, so
          # `github.ref_name` asked for a manifest nobody had pushed.
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # examples/showcase rather than examples/payos: four of payos's guide
          # pages are generated by a script and gitignored, so a fresh checkout
          # has a sidebar pointing at files that do not exist — and the checker
          # was right to refuse to build it.
          if ! docker build --progress plain \
            --build-arg ZELLIJ_VERSION="$VERSION" \
            --build-arg CONTENT=examples/showcase/content \
            -f docker/site.Dockerfile -t zellij-smoke .
          then
            echo "::group::What the image actually received"
            docker run --rm -v "$PWD/examples/showcase/content:/c:ro" \
              "${REGISTRY}/${IMAGE}:${VERSION}" sh -c 'find /c -type f | sort' || true
            echo "::endgroup::"
            exit 1
          fi

          docker run -d --name smoke -p 3000:3000 zellij-smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then echo "serving"; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1
