# Publishes the Zellij base image to GHCR.
#
# The image is public even though this repository is not: it is how Zellij is
# distributed to people who cannot clone the source. Nothing secret goes into
# it — the engine is shipped as its build output, and the layer holding it is
# the same layer everyone else pulls.
name: Base image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: base-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/zellij-base

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base.Dockerfile
          # arm64 as well as amd64: a lot of authors are on Apple silicon, and
          # emulating the wrong architecture locally turns a fast build slow.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove the image can build a site
        run: |
          docker build \
            --build-arg ZELLIJ_VERSION=${{ github.ref_name }} \
            --build-arg CONTENT=examples/payos/content \
            -f docker/site.Dockerfile -t zellij-smoke .
          docker run -d --name smoke -p 3000:3000 zellij-smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then echo "serving"; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1
