name: Composer visual probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @shebka/zellij
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run build
        working-directory: examples/showcase
      - run: npx playwright test e2e/compose.spec.ts --project mobile -g 'compositions retain' --repeat-each=3 --retries=0
        working-directory: examples/showcase
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: composer-visual-probe
          path: examples/showcase/test-results/
          retention-days: 7
