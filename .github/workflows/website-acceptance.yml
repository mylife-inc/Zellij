name: Composer progressive playback probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @shebka/zellij
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
        working-directory: examples/showcase
      - run: npx playwright test e2e/compose.spec.ts e2e/compose-video.spec.ts --retries=0
        working-directory: examples/showcase
      - name: Build docs
        working-directory: examples/zellij-docs
        env:
          ZELLIJ_OUTPUT: export
        run: |
          node ../../engine/packages/zellij/bin/zellij.mjs prepare
          node ../../node_modules/next/dist/bin/next build --webpack
      - run: node scripts/check-docs-preservation.mjs
      - run: node --test scripts/check-docs-preservation.test.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: composer-progressive-probe
          path: examples/showcase/test-results/
          retention-days: 7
