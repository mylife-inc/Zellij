# Everything that must hold before a change lands.
name: CI

on:
  push:
    branches: [main, content-model]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace @shebka/zellij

      - name: Authored examples pass deep and strict validation
        run: |
          for example in showcase zellij-docs codeseal-docs; do
            node engine/packages/zellij/bin/zellij.mjs check "examples/$example/content" --deep --strict || exit 1
          done

  # The guarantee that the CLI and the engine cannot disagree.
  #
  # `zel explain` and `zel context` are compiled from a JSON file the engine
  # generates. Nothing stops someone adding a field to a zod schema and not
  # regenerating it — nothing except this, which regenerates and fails if the
  # committed copy has fallen behind. The tool that scaffolds a section and the
  # engine that validates it stay the same definition by construction.
  schema:
    name: Embedded schema is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @shebka/zellij

      - name: Regenerate
        run: |
          node engine/packages/zellij/bin/zellij.mjs context \
            cli/crates/zellij-core/generated/schema.json --json
          node engine/packages/zellij/bin/zellij.mjs context \
            cli/crates/zellij-core/generated/context.md

      - name: Fail if it changed
        run: |
          if ! git diff --quiet -- cli/crates/zellij-core/generated; then
            echo "::error::The engine's schemas have changed and the CLI's embedded copy has not."
            echo
            echo "Regenerate and commit:"
            echo "  npm run build --workspace @shebka/zellij"
            echo "  node engine/packages/zellij/bin/zellij.mjs context cli/crates/zellij-core/generated/schema.json --json"
            echo "  node engine/packages/zellij/bin/zellij.mjs context cli/crates/zellij-core/generated/context.md"
            echo
            git diff --stat -- cli/crates/zellij-core/generated
            exit 1
          fi
          echo "Embedded schema matches the engine."

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo fmt --all --check
        working-directory: cli
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: cli
      - run: cargo test --workspace
        working-directory: cli

      # `zel new docs` promises a folder that validates. Rust can check the
      # YAML parses; only the engine can say whether the content model accepts
      # it. This caught `legal` written at the top level instead of under
      # `footer:` — valid YAML, silently ignored, and the copyright line simply
      # never appeared.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @shebka/zellij

      - run: cargo build --manifest-path cli/Cargo.toml
      - name: Build the engine image from this checkout
        run: docker build -f docker/base.Dockerfile -t zellij-ci .

      - name: Packaged preparation matches exported routes and heading anchors
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: node scripts/check-preparation.mjs cli/target/debug/zel --export

      - name: Deep and strict checks match exported content
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: node scripts/check-validation.mjs cli/target/debug/zel

      - name: Scaffold names, rendered links, and content discovery
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: node scripts/check-scaffolds.mjs cli/target/debug/zel "$(mktemp -d)/fixtures" --container-check

      - name: Static exports preserve the previous site on failure
        env:
          # Verify matching CLI/engine changes before publishing either one.
          ZELLIJ_IMAGE: zellij-ci
        run: |
          set -euo pipefail
          zel="$PWD/cli/target/debug/zel"
          work=$(mktemp -d)
          "$zel" new docs "$work/content" --name Acme --guide
          "$zel" build "$work/content" --out "$work/site"
          test -s "$work/site/index.html"
          test -f "$work/site/.zellij-output"
          cp "$work/site/index.html" "$work/previous.html"

          # Fail during MDX preparation, after the fast content check passes.
          # The previous export must survive this late build failure too.
          cp "$work/content/01-guide/index.mdx" "$work/guide.mdx"
          printf '\n<Callout>\n' >> "$work/content/01-guide/index.mdx"
          if "$zel" build "$work/content" --out "$work/site"; then
            echo '::error::Unclosed MDX component unexpectedly built'
            exit 1
          fi
          cmp "$work/previous.html" "$work/site/index.html"

          # Ordinary rebuilding replaces old output and removes stale pages.
          cp "$work/guide.mdx" "$work/content/01-guide/index.mdx"
          printf 'type: hero\nheadline: Updated site\n' > "$work/content/sections/home/hero.yaml"
          printf 'obsolete\n' > "$work/site/obsolete.html"
          "$zel" build "$work/content" --out "$work/site"
          grep -q 'Updated site' "$work/site/index.html"
          test ! -e "$work/site/obsolete.html"

      - name: Every Rust section template validates and renders
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          node scripts/check-section-templates.mjs cli/target/debug/zel "$work/content"
          cli/target/debug/zel build "$work/content" --out "$work/site"
          test -s "$work/site/index.html"
          for type in $(node -p "require('./cli/crates/zellij-core/generated/schema.json').sectionTypes.filter(t => t !== 'hero').join(' ')"); do
            test -s "$work/site/$type.html"
          done
          test -s "$work/site/_zellij/assets/replace-me.svg"
          test -s "$work/site/_zellij/assets/replace-me.mp4"

      - name: Converted documents link to exported routes and assets
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: |
          work=$(mktemp -d)
          node scripts/check-conversion.mjs cli/target/debug/zel "$work/conversion" --export

  e2e:
    name: Showcase end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Jobs use separate clean checkouts. `zellij prepare` needs the engine's
      # bundled Node helpers; the Engine job's dist/ is not present here.
      - run: npm run build --workspace @shebka/zellij
      # webkit for the mobile-safari project — see playwright.config.ts.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
        working-directory: examples/showcase
      - run: npx playwright test
        working-directory: examples/showcase
      - name: Content-owned deployment prefix works in a production browser
        run: node scripts/check-basepath.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failure-details
          path: examples/showcase/test-results/
          retention-days: 7
