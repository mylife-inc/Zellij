# Everything that must hold before a change lands.
name: CI

on:
  push:
    branches: [main, content-model]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-platforms:
    name: Native images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo build --locked -p zellij-cli
        working-directory: cli
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker build --progress=plain -f docker/base.Dockerfile -t zellij-ci .
      - name: Replay native generated CI and measure image size
        env:
          DOCKER_CONTEXT: default
          ZELLIJ_IMAGE: zellij-ci
          TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/check-multi-platform-ci.mjs "$TARGET_ARCH" "$RUNNER_TEMP/multi-images"
      - uses: actions/upload-artifact@v7
        with:
          name: multi-images-${{ matrix.arch }}
          path: ${{ runner.temp }}/multi-images
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  image-manifest:
    name: Combined image manifests
    needs: image-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: multi-images-amd64
          path: ${{ runner.temp }}/multi-images/amd64
      - uses: actions/download-artifact@v8
        with:
          name: multi-images-arm64
          path: ${{ runner.temp }}/multi-images/arm64
      - name: Replay generated manifest publication against a local registry
        run: node scripts/check-multi-platform-ci.mjs combine "$RUNNER_TEMP/multi-images"

  native-packages:
    uses: ./.github/workflows/native-packages.yml
    permissions:
      contents: read

  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test scripts/release-policy.test.mjs scripts/download-release.test.mjs scripts/check-delivery-http.test.mjs
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace @shebka/zellij

      - name: Installed development watcher owns its child process
        run: node scripts/check-dev-preparation.mjs

      - name: Authored examples pass deep and strict validation
        run: |
          for example in showcase zellij-docs codeseal-docs; do
            node engine/packages/zellij/bin/zellij.mjs check "examples/$example/content" --deep --strict || exit 1
          done

      - name: Build documentation with the preserved authored images
        working-directory: examples/zellij-docs
        env:
          ZELLIJ_OUTPUT: export
        run: |
          node ../../engine/packages/zellij/bin/zellij.mjs prepare
          node ../../node_modules/next/dist/bin/next build --webpack

      - run: npx playwright install --with-deps chromium --only-shell
      - name: Published documentation routes, bookmarks, assets and search survive
        run: node scripts/check-docs-preservation.mjs
      - name: Documentation acceptance rejects hydration and runtime errors
        run: node --test scripts/check-docs-preservation.test.mjs

  # The guarantee that the CLI and the engine cannot disagree.
  #
  # `zel explain` and `zel context` are compiled from a JSON file the engine
  # generates. Nothing stops someone adding a field to a zod schema and not
  # regenerating it — nothing except this, which regenerates and fails if the
  # committed copy has fallen behind. The tool that scaffolds a section and the
  # engine that validates it stay the same definition by construction.
  schema:
    name: Embedded schema is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @shebka/zellij

      - name: Regenerate
        run: |
          node engine/packages/zellij/bin/zellij.mjs context \
            cli/crates/zellij-core/generated/schema.json --json
          node engine/packages/zellij/bin/zellij.mjs context \
            cli/crates/zellij-core/generated/context.md

      - name: Fail if it changed
        run: |
          if ! git diff --quiet -- cli/crates/zellij-core/generated; then
            echo "::error::The engine's schemas have changed and the CLI's embedded copy has not."
            echo
            echo "Regenerate and commit:"
            echo "  npm run build --workspace @shebka/zellij"
            echo "  node engine/packages/zellij/bin/zellij.mjs context cli/crates/zellij-core/generated/schema.json --json"
            echo "  node engine/packages/zellij/bin/zellij.mjs context cli/crates/zellij-core/generated/context.md"
            echo
            git diff --stat -- cli/crates/zellij-core/generated
            exit 1
          fi
          echo "Embedded schema matches the engine."

      - name: Native wrapper template matches the engine initializer
        run: node scripts/prepare-app-scaffold.mjs

      - name: Portable theme tokens match the hosted engine
        run: node scripts/prepare-portable.mjs
      - name: Verify portable Mermaid runtime and notices
        run: node scripts/prepare-portable-mermaid.mjs

  portable:
    name: Portable docs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo test --locked -p zellij-docs
        working-directory: cli
      - run: cargo test --locked -p zellij-engine
        working-directory: cli
      - run: cargo test --locked -p zellij-cli --bin zel --test portable_build --test portable_check --test hosted_check --test portable_starter --test runtime_requirements --test site_layout --test aliases --test static_images --test delivery --test netlify --test ci_workflows --test import_delivery --test import_metadata --test import_autogenerated --test import_categories --test import_slugs --test import_website_urls --test import_relative_urls --test import_vitepress --test import_jekyll --test import_hugo --test import_sphinx --test app_scaffolding --test formatting --test features --test output_controls
        working-directory: cli
      - run: cargo build --locked -p zellij-cli
        working-directory: cli
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build --workspace @shebka/zellij
      - name: Hosted build overrides and image recipes on the native platform
        run: node scripts/check-build-overrides.mjs
      - name: Image build arguments and delivery on the native platform
        run: node scripts/check-image-build-args.mjs
      - name: Combined image publication on the native platform
        run: node scripts/check-multi-platform.mjs
      - name: Native dev bindings, browser readiness and cancellation
        run: node scripts/check-dev-options.mjs
      - name: Hosted preview orchestration and cancellation on the native platform
        run: node scripts/check-hosted-preview.mjs
      - name: Native distribution extraction, failures and cancellation
        run: node scripts/check-eject.mjs
      - name: Native YAML formatting preserves authored sites
        run: node scripts/check-formatting.mjs
      - name: Native validation watch recovers from edits and stops on Ctrl-C
        run: |
          node scripts/check-validation-watch.mjs
          node scripts/check-validation-watch.mjs --config
      - name: Quiet preview retains rebuilds, failures and Ctrl-C cleanup
        run: node scripts/check-output-controls.mjs
      - name: Native editable wrapper installs and builds outside the workspace
        run: node scripts/check-app-scaffold.mjs
      - name: Native output works directly from disk without networking
        run: node scripts/check-portable.mjs
      - name: Native HTTP preview, watch/reload, browser launch and console shutdown
        run: node scripts/check-preview.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: portable-preview-${{ matrix.os }}
          path: test-results/preview-watch-*.zip
          retention-days: 7

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo fmt --all --check
        working-directory: cli
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: cli
      - run: cargo test --workspace
        working-directory: cli

      - name: Native CLI supports its minimum Rust version
        working-directory: cli
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          cargo +1.96.0 check --locked --workspace --all-targets

      # `zel new docs` promises a folder that validates. Rust can check the
      # YAML parses; only the engine can say whether the content model accepts
      # it. This caught `legal` written at the top level instead of under
      # `footer:` — valid YAML, silently ignored, and the copyright line simply
      # never appeared.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @shebka/zellij

      - run: cargo build --manifest-path cli/Cargo.toml
      - name: Manual release-delivery workflows match the CLI generator
        run: node scripts/prepare-delivery-acceptance.mjs cli/target/debug/zel
      - name: Build the engine image from this checkout
        run: docker build -f docker/base.Dockerfile -t zellij-ci .

      - name: Keep container acceptance on the runtime that built its image
        # Automatic fallback can select Podman when Docker's probe fails under
        # load, but Podman cannot see the image in Docker's local image store.
        run: printf 'DOCKER_CONTEXT=%s\n' "$(docker context show)" >> "$GITHUB_ENV"

      - name: Converted documents link to exported routes and assets
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: |
          work=$(mktemp -d)
          node scripts/check-conversion.mjs cli/target/debug/zel "$work/conversion" --export

      - name: Hosted build overrides affect output without changing authored content
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: node scripts/check-hosted-build-overrides.mjs

      - name: Ejected distribution installs, validates and builds outside the checkout
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: |
          npx playwright install --with-deps chromium
          node scripts/check-app-scaffold.mjs --eject

      - name: Hosted optional features install and render only when selected
        run: node scripts/check-hosted-features.mjs

      - name: Hosted Netlify export and digest upload acceptance
        env:
          ZELLIJ_IMAGE: zellij-ci
        working-directory: cli
        run: |
          acceptance_test=netlify::tests::hosted_container_export_upload_preserves_prefix_assets_and_previous_output
          cargo test --locked -p zellij-cli --bin zel "$acceptance_test" -- --ignored --exact --list | grep -F "$acceptance_test: test"
          cargo test --locked -p zellij-cli --bin zel "$acceptance_test" -- --ignored --exact --nocapture

      - name: Hosted Cloudflare Pages export and native upload acceptance
        env:
          ZELLIJ_IMAGE: zellij-ci
        working-directory: cli
        run: |
          acceptance_test=cloudflare::tests::hosted_export_upload_preserves_prefix_assets_and_previous_output
          cargo test --locked -p zellij-cli --bin zel "$acceptance_test" -- --ignored --exact --list | grep -F "$acceptance_test: test"
          cargo test --locked -p zellij-cli --bin zel "$acceptance_test" -- --ignored --exact --nocapture

      - name: Hosted Vercel prebuilt export and native upload acceptance
        env:
          ZELLIJ_IMAGE: zellij-ci
        working-directory: cli
        run: |
          acceptance_test=vercel::tests::hosted_export_upload_preserves_prefix_assets_and_previous_output
          cargo test --locked -p zellij-cli --bin zel "$acceptance_test" -- --ignored --exact --list | grep -F "$acceptance_test: test"
          cargo test --locked -p zellij-cli --bin zel "$acceptance_test" -- --ignored --exact --nocapture

      - name: Hosted GitHub Pages export and native publication acceptance
        env:
          ZELLIJ_IMAGE: zellij-ci
        working-directory: cli
        run: |
          acceptance_test=github_pages::tests::hosted_export_uses_pages_mount_and_preserves_assets_source_and_previous_output
          cargo test --locked -p zellij-cli --bin zel "$acceptance_test" -- --ignored --exact --list | grep -F "$acceptance_test: test"
          cargo test --locked -p zellij-cli --bin zel "$acceptance_test" -- --ignored --exact --nocapture

      - name: Hosted validation watch uses the real engine and recovers after edits
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: node scripts/check-validation-watch.mjs --hosted --config

      - name: Hosted static preview rebuilds and reloads with the real engine
        env:
          ZELLIJ_IMAGE: zellij-ci
          NO_COLOR: '1'
        run: |
          npx playwright install --with-deps chromium
          node scripts/check-hosted-preview.mjs --real

      - name: Rust dev reloads browsers after mounted content and asset updates
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: node scripts/check-dev-site.mjs --container cli/target/debug/zel

      - name: Fresh site builds without font downloads or network access
        run: docker build --progress=plain -f scripts/fixtures/fonts.Dockerfile .

      - name: Enable ARM64 image acceptance
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Cross-architecture image build, registry and HTTP acceptance
        run: node scripts/check-image-platform.mjs cli/target/debug/zel

      # Each group builds large Next.js layers. Retain tagged engine images.
      - name: Reclaim container build cache before static images
        run: docker builder prune --all --force

      - name: Static image publication and portable/hosted HTTP acceptance
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: |
          node scripts/check-static-images.mjs cli/target/debug/zel

      - name: Reclaim container build cache before Next images
        run: docker builder prune --all --force

      - name: Next image publication and portable/hosted browser acceptance
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: node scripts/check-next-images.mjs cli/target/debug/zel

      - name: Reclaim container build cache before imported images
        run: docker builder prune --all --force

      - name: Ship imports to static and Next images with registry and browser acceptance
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: node scripts/check-ship.mjs cli/target/debug/zel

      - name: Reclaim container build cache before final exports
        run: docker builder prune --all --force

      - name: Packaged preparation matches exported routes and heading anchors
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: node scripts/check-preparation.mjs cli/target/debug/zel --export

      - name: Deep and strict checks match exported content
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: node scripts/check-validation.mjs cli/target/debug/zel

      - name: Scaffold names, rendered links, and content discovery
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: node scripts/check-scaffolds.mjs cli/target/debug/zel "$(mktemp -d)/fixtures" --container-check

      - name: Static exports preserve the previous site on failure
        env:
          # Verify matching CLI/engine changes before publishing either one.
          ZELLIJ_IMAGE: zellij-ci
        run: |
          set -euo pipefail
          zel="$PWD/cli/target/debug/zel"
          work=$(mktemp -d)
          "$zel" new docs "$work/content" --name Acme --guide
          "$zel" build "$work/content" --out "$work/site"
          test -s "$work/site/index.html"
          test -f "$work/site/.zellij-output"
          cp "$work/site/index.html" "$work/previous.html"

          # Fail during MDX preparation, after the fast content check passes.
          # The previous export must survive this late build failure too.
          cp "$work/content/content/01-guide/index.mdx" "$work/guide.mdx"
          printf '\n<Callout>\n' >> "$work/content/content/01-guide/index.mdx"
          if "$zel" build "$work/content" --out "$work/site"; then
            echo '::error::Unclosed MDX component unexpectedly built'
            exit 1
          fi
          cmp "$work/previous.html" "$work/site/index.html"

          # Ordinary rebuilding replaces old output and removes stale pages.
          cp "$work/guide.mdx" "$work/content/content/01-guide/index.mdx"
          printf 'type: hero\nheadline: Updated site\n' > "$work/content/content/sections/home/hero.yaml"
          printf 'obsolete\n' > "$work/site/obsolete.html"
          "$zel" build "$work/content" --out "$work/site"
          grep -q 'Updated site' "$work/site/index.html"
          test ! -e "$work/site/obsolete.html"

      - name: Every Rust section template validates and renders
        env:
          ZELLIJ_IMAGE: zellij-ci
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          node scripts/check-section-templates.mjs cli/target/debug/zel "$work/content"
          cli/target/debug/zel build "$work/content" --out "$work/site"
          test -s "$work/site/index.html"
          for type in $(node -p "require('./cli/crates/zellij-core/generated/schema.json').sectionTypes.filter(t => t !== 'hero').join(' ')"); do
            test -s "$work/site/$type.html"
          done
          test -s "$work/site/_zellij/assets/replace-me.svg"
          test -s "$work/site/_zellij/assets/replace-me.mp4"


  e2e:
    name: Showcase end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Jobs use separate clean checkouts. `zellij prepare` needs the engine's
      # bundled Node helpers; the Engine job's dist/ is not present here.
      - run: npm run build --workspace @shebka/zellij
      # webkit for the mobile-safari project — see playwright.config.ts.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
        working-directory: examples/showcase
      - run: npx playwright test
        working-directory: examples/showcase
      - name: Content-owned deployment prefix works in a production browser
        run: node scripts/check-basepath.mjs
      - name: Development browsers reload after valid edits and retain pages through invalid edits
        run: node scripts/check-dev-site.mjs
      - uses: actions/upload-artifact@v7
        # Keep the initial failure even when Playwright's retry makes the job green.
        if: always()
        with:
          name: playwright-failure-details
          path: |
            examples/showcase/test-results/**/trace.zip
            examples/showcase/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
