name: WinGet acceptance
on:
  workflow_call:
    inputs:
      from_artifacts:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      binary_run:
        description: Optional prior WinGet run with verified native artifacts (harness-only retesting)
        type: string
        default: ''
      public_version:
        description: Optional published candidate matching this source (verify manifests and install from public URLs)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: ${{ !inputs.from_artifacts && !inputs.binary_run && !inputs.public_version }}
    name: WinGet binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, target: x86_64-pc-windows-msvc}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: release-${{ matrix.target }}
      - name: Package current CLI
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/package-native.mjs workspace "$env:TARGET" dist
      - name: Native ownership and upgrade regressions
        run: cargo test --manifest-path cli/Cargo.toml --locked --release --target '${{ matrix.target }}' -p zellij-cli --bin zel maintenance::upgrade
      - uses: actions/upload-artifact@v7
        with:
          name: winget-native-${{ matrix.target }}
          path: dist/zel-*
          if-no-files-found: error
          retention-days: 7
  install:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || ((inputs.from_artifacts || inputs.binary_run || inputs.public_version) && needs.build.result == 'skipped')) }}
    name: WinGet lifecycle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, target: x86_64-pc-windows-msvc}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        if: inputs.public_version == ''
        with:
          pattern: ${{ inputs.from_artifacts && 'binary-*-pc-windows-msvc' || 'winget-native-*' }}
          run-id: ${{ inputs.binary_run || '' }}
          github-token: ${{ inputs.binary_run && github.token || '' }}
          merge-multiple: true
          path: dist
      - name: Verify public archives and the exact published manifest bundle
        if: inputs.public_version != ''
        env:
          VERSION: ${{ inputs.public_version }}
        run: node scripts/fetch-winget-release.mjs "$env:VERSION" dist
      - name: Provision checksum-pinned Microsoft WinGet
        shell: powershell
        run: .\scripts\prepare-winget.ps1
      - name: Validate manifests and test managed lifecycle
        env:
          ZEL_WINGET_PUBLIC: ${{ inputs.public_version != '' && 'true' || 'false' }}
          ZEL_WINGET_BINARY_RUN: ${{ inputs.public_version && 'public-release' || inputs.binary_run || github.run_id }}
          ZEL_WINGET_RECEIPT: ${{ runner.temp }}/winget-evidence/receipt.json
        run: node scripts/check-winget.mjs dist
      - name: Retain lifecycle receipt and WinGet diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: winget-evidence-${{ matrix.target }}
          path: ${{ runner.temp }}/winget-evidence/
          if-no-files-found: warn
          retention-days: 14
