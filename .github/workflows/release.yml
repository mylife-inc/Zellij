# The whole release, from one tag.
#
#     zrelease v0.2.0
#
# Tests, then everything a release produces, in parallel: the container images,
# the CLI binaries for every platform, and the documentation site. Tag-driven
# because a release is a decision, and every commit to main is not one.
#
# Nothing here needs a token you have to create. `GITHUB_TOKEN` is issued to the
# job and covers both GHCR and Releases; only Netlify needs secrets, and the
# site is skipped rather than failed when they are absent.
name: Release

on:
  push:
    tags: ['v*']
  # Dispatch against a tag rather than taking one as input. An input reaching
  # `ref:` or a shell is the ref-injection shape, and it buys nothing here —
  # selecting the tag in the UI produces the same ref.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/zellij-base

jobs:
  # ------------------------------------------------------------------ gate
  # Everything downstream depends on this, so a release cannot be cut from
  # code that does not pass what main has to pass.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --root engine/packages/zellij
      - run: npm run build --workspace @shebka/zellij

      # The schema is compiled into the binary about to be published, so a
      # stale copy would ship a `zel explain` describing a content model the
      # engine no longer has.
      - name: The embedded schema is current
        run: |
          node engine/packages/zellij/bin/zellij.mjs context \
            cli/crates/zellij-core/generated/schema.json --json
          node engine/packages/zellij/bin/zellij.mjs context \
            cli/crates/zellij-core/generated/context.md
          git diff --exit-code -- cli/crates/zellij-core/generated ||
            { echo "::error::Regenerate the embedded schema and commit before tagging."; exit 1; }

      - run: cargo fmt --all --check
        working-directory: cli
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: cli
      - run: cargo test --workspace
        working-directory: cli

  # ------------------------------------------------------------------ images
  # Each architecture on a runner of that architecture, then stitched into one
  # manifest. Emulating arm64 through QEMU crashed while running Node —
  # "qemu: uncaught target signal 4 (Illegal instruction)" — intermittently and
  # in a different variant each time.
  images:
    name: Image ${{ matrix.features }} · ${{ matrix.platform.arch }}
    needs: verify
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: false
      matrix:
        features: [none, maths, diagrams, all]
        platform:
          - { arch: amd64, name: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, name: linux/arm64, runner: ubuntu-24.04-arm }

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base.Dockerfile
          platforms: ${{ matrix.platform.name }}
          build-args: ZELLIJ_FEATURES=${{ matrix.features }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.features }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.features }}-${{ matrix.platform.arch }}

      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.features }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # --------------------------------------------------------------- manifests
  manifests:
    name: Publish image ${{ matrix.features }}
    needs: images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { features: none, suffix: '' }
          - { features: maths, suffix: '-maths' }
          - { features: diagrams, suffix: '-diagrams' }
          - { features: all, suffix: '-all' }

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.features }}-*
          merge-multiple: true

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Says what it is about to do before doing it.
      #
      # The `diagrams` merge failed twice on rc.6 while the other three
      # succeeded, and the log was unrecoverable afterwards — GitHub returned
      # `BlobNotFound` for the job minutes later, so there was nothing to read.
      # A failure that cannot be diagnosed after the fact has to diagnose itself
      # at the time.
      #
      # Two of these are the whole question: how many digests arrived (two, one
      # per architecture — anything else means an artefact went missing) and
      # what tags are about to be written.
      - name: What is being merged
        working-directory: /tmp/digests
        run: |
          echo "digests downloaded:"
          ls -la
          echo "count: $(ls -1 | wc -l)  (expected 2)"
          echo "tags:"
          jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"

      - name: Stitch the architectures into one manifest
        working-directory: /tmp/digests
        run: |
          set -x
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)

      # Only the default variant. The others differ by three lines of JSON, and
      # building four sites to learn the same thing is time every release pays.
      - name: The published image can build a site
        if: matrix.features == 'none'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker build --progress plain \
            --build-arg ZELLIJ_VERSION="$VERSION" \
            --build-arg CONTENT=examples/showcase/content \
            -f docker/site.Dockerfile -t smoke .
          docker run -d --name smoke -p 3000:3000 smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then echo "serving"; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

  binaries:
    name: zel (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}

    # Both Darwin targets are built on the Apple Silicon runner.
    #
    # `macos-13` is the last Intel image GitHub offers, and it is being retired:
    # rc.4 had every other job green — eight images, four manifests, the docs,
    # four of five binaries — and sat *queued* for over an hour waiting for an
    # Intel machine that never came. Nothing had failed. The release simply
    # could not finish, and `publish` never started, which is why the installer
    # was still missing from the public repository.
    #
    # Cross-compiling costs nothing here. Rust publishes `rust-std` for both
    # Apple targets and the runner's SDK carries both architectures, so
    # `--target x86_64-apple-darwin` on an arm64 host needs no extra linker and
    # no emulation — unlike the arm64 *Linux* build, which is why that one is
    # still on a native runner rather than under QEMU.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}

      - name: Build
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        # Through the environment rather than interpolated: a ref name reaching
        # a shell directly is one surprising character away from a problem.
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="zel-${VERSION}-${TARGET}"
          out="cli/target/${TARGET}/release"

          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "./${out}/zel.exe"
            archive="${name}.zip"
          else
            tar -czf "${name}.tar.gz" -C "$out" zel
            archive="${name}.tar.gz"
          fi

          # Checksums travel with the binaries, so an install script can verify
          # one before putting anything on a PATH.
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      # `binary-` so the publish job can ask for these and nothing else. The
      # run also carries eight `digest-*` artefacts that exist only to get a
      # digest from an image build to the manifest merge, and a release has no
      # use for them.
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

  # --------------------------------------------------------------------- docs
  docs:
    name: Documentation site
    needs: verify
    runs-on: ubuntu-latest

    # Two facts, neither of them a secret.
    #
    # `HAS_NETLIFY` is the *answer* to whether the credentials exist, not the
    # credentials — the comparison happens before the value is bound, so this
    # job carries a boolean. Putting the token here instead would hand it to
    # `npm ci` and every install script in the dependency tree, for the sake of
    # an `if` condition. The token is bound in the one step that deploys.
    #
    # `DEPLOY_DOCS` is a repository variable, and the deploy is off until it is
    # set to `true`. Having the credentials on hand is not the same as being
    # ready to publish — a domain still has to be pointed, and the first release
    # should not be the thing that discovers it has not been.
    env:
      HAS_NETLIFY: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
      DEPLOY_DOCS: ${{ vars.DEPLOY_DOCS }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @shebka/zellij

      - name: Build the site
        working-directory: examples/zellij-docs
        env:
          ZELLIJ_OUTPUT: export
        run: npm run build

      # Skipped rather than failed when the secrets are absent: a release that
      # produced binaries and images is still a release, and someone cloning
      # this repository has no Netlify site to deploy to.
      - name: Deploy to Netlify
        if: env.DEPLOY_DOCS == 'true' && env.HAS_NETLIFY == 'true'
        working-directory: examples/zellij-docs
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          RELEASE: ${{ github.ref_name }}
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod --dir out \
            --message "Release $RELEASE"

      # The site is built either way, so a release that publishes binaries and
      # images is still a release, and the build itself still proves the content
      # exports cleanly.
      - name: Say why the site was not deployed
        if: env.DEPLOY_DOCS != 'true' || env.HAS_NETLIFY != 'true'
        run: |
          echo "::notice::The site was built but not deployed."
          if [ "$DEPLOY_DOCS" != "true" ]; then
            echo "Set the repository variable DEPLOY_DOCS=true to publish it."
          else
            echo "Set NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in the repository secrets."
          fi

  # ------------------------------------------------------------------ publish
  publish:
    name: Publish the release
    needs: [manifests, binaries, docs]

    # Runs after the images, and not because of them.
    #
    # This job publishes the binaries and the installer. It reads neither an
    # image digest nor an image tag — the tags in the release body below are
    # text. But `needs` is a hard gate as well as an ordering, so a failed
    # manifest merge for one feature variant took the installer down with it,
    # and that is most of why five releases in a row left
    # `raw.githubusercontent.com/…/install.sh` returning 404.
    #
    # `always()` keeps the ordering and drops the gate, then the two conditions
    # put back the gates that are real: no release without the binaries it
    # attaches, and none if the documentation stopped building. A broken image
    # variant is visible on its own job and does not deserve to withhold the
    # thing people actually run.
    if: ${{ always() && needs.binaries.result == 'success' && needs.docs.result == 'success' }}

    runs-on: ubuntu-latest

    # This repository is private, and a private repository's release assets
    # need a token to download — which makes a `curl … | sh` installer
    # impossible. So the binaries are published twice: here, where the team can
    # find them beside the code, and in a public repository that exists to hold
    # artefacts for several private projects.
    env:
      RELEASES_REPO: mylife-inc/releases
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v7

      # The binaries and their checksums, and nothing else in the run.
      #
      # Without the pattern this asked for all twenty-one artefacts, and rc.5
      # died here: four downloaded, the fifth failed its five retries, and the
      # job went red before a single publish step ran. Thirteen of the
      # twenty-one were never wanted — eight digests carrying a sha256 from an
      # image build to the manifest merge, which is finished by the time this
      # job starts.
      #
      # It was also wrong on success. `files: artifacts/*` below attaches what
      # this downloads, so every one of those digest files would have been
      # published as a release asset beside the binaries.
      #
      # Five artefacts instead of twenty-one is a smaller thing to go wrong, and
      # a release that carries only what belongs in one.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      # The installer is an artefact too. Publishing it beside the binaries
      # means a pinned version can always be installed the same way the release
      # it belongs to was.
      - run: cp scripts/install.sh artifacts/install.sh

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Install

            ```
            curl -fsSL https://raw.githubusercontent.com/mylife-inc/releases/main/zellij/install.sh | sh
            ```

            Or download the archive for your platform below, verify it against
            its `.sha256`, and put `zel` on your PATH.

            ## Container images

            ```
            ghcr.io/${{ github.repository_owner }}/zellij-base:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/zellij-base:${{ github.ref_name }}-maths
            ghcr.io/${{ github.repository_owner }}/zellij-base:${{ github.ref_name }}-diagrams
            ghcr.io/${{ github.repository_owner }}/zellij-base:${{ github.ref_name }}-all
            ```

      # The public half. Tagged `zellij-<version>` because the repository holds
      # The installer lives beside the binaries, on a branch rather than as a
      # release asset.
      #
      # An asset would need a release to point at, and `latest` in a repository
      # shared by several projects is not necessarily ours — the same scoping
      # problem the tags have. A file on `main` has one stable URL, needs no
      # release, and can be read before installing:
      #
      #   raw.githubusercontent.com/mylife-inc/releases/main/zellij/install.sh
      #
      # This runs **before** the release below, and not only for tidiness: a tag
      # needs a commit to point at, and a repository that has never been pushed
      # to has none. The first release into an empty releases repository fails
      # at `git tag` unless something has committed first.
      - name: Keep the installer current in the releases repository
        if: env.HAS_RELEASES_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git clone "https://x-access-token:${TOKEN}@github.com/${RELEASES_REPO}.git" /tmp/releases
          cd /tmp/releases

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # An empty clone leaves HEAD unborn, and the branch it would be born
          # on depends on the runner's git defaults. Name it.
          git checkout -B main

          mkdir -p zellij
          cp "${GITHUB_WORKSPACE}/scripts/install.sh" zellij/install.sh
          git add zellij/install.sh

          # `--cached`, because plain `git diff` does not see a file that is not
          # tracked yet — which is every file the first time, and reported the
          # installer as unchanged when it had never been published at all.
          if git diff --cached --quiet; then
            echo "The installer is unchanged."
            exit 0
          fi

          git commit -m "zellij: installer as of ${VERSION}"
          git push -u origin main

      # artefacts for several projects and `latest` there is not ours — the
      # installer resolves the newest tag carrying this scope.
      - name: Publish to the public releases repository
        if: env.HAS_RELEASES_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_GITHUB_TOKEN }}
          tag_name: zellij-${{ github.ref_name }}
          name: Zellij ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
          body: |
            `zel` — the Zellij CLI, ${{ github.ref_name }}.

            ```
            curl -fsSL https://raw.githubusercontent.com/mylife-inc/releases/main/zellij/install.sh | sh
            ```

            Source lives in a private repository. These binaries, their
            checksums and the installer are the public artefacts.

      - name: Say why the public release was skipped
        if: env.HAS_RELEASES_TOKEN != 'true'
        run: |
          echo "::warning::RELEASES_GITHUB_TOKEN is not set, so nothing was"
          echo "published to ${RELEASES_REPO}. The installer at"
          echo "https://raw.githubusercontent.com/mylife-inc/releases/main/zellij/install.sh will not find this release."
