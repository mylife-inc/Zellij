name: Browser scheduling reduction
on:
  push:
    branches: [codex/browser-scheduling-probe]
permissions:
  contents: read
jobs:
  probe:
    name: one-cpu / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [showcase-control, escape-cancel, showcase-flat, dom-effects, dom-flat]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @shebka/zellij
      - run: node scripts/browser-resize-reduction/build.mjs
      - run: npm run build --workspace @shebka/zellij-showcase
      - run: npx playwright install --with-deps webkit
      - name: Record exact browser and source identities
        run: |
          mkdir -p scheduling-results
          git rev-parse HEAD > scheduling-results/source.txt
          cp node_modules/playwright-core/browsers.json scheduling-results/browsers.json
          node --version > scheduling-results/node.txt
          npx playwright --version > scheduling-results/playwright.txt
      - name: Natural resize sequence with zero retries
        working-directory: examples/showcase
        env:
          PROBE_VARIANT: ${{ matrix.variant }}
          DEBUG: pw:browser
        shell: bash
        run: |
          set -euo pipefail
          python3 ../../scripts/browser-scheduling-probe/run.py one-cpu ../../scheduling-results/host npx playwright test --config playwright.scheduling.config.ts 2>&1 | tee ../../scheduling-results/browser.log
      - name: Summarize structured resize outcomes
        if: always() && hashFiles('examples/showcase/scheduling-results/results.json') != ''
        run: node scripts/report-browser-results.mjs examples/showcase/scheduling-results/results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reduction-${{ matrix.variant }}
          path: |
            scheduling-results/
            examples/showcase/scheduling-results/
          retention-days: 14
          if-no-files-found: error
