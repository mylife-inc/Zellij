# Requires the pinned compatible zel release and, for hosted/image builds, its engine image.
# Generation does not check release availability or provision credentials.
concurrency:
  cancel-in-progress: false
  group: docs-36653820d50c0cbc9cf6c7ce09a7a366b49db4a74574877fee01285b20498f9c-${{ github.ref }}
defaults:
  run:
    shell: bash
env:
  SITE_CONFIG: ./scripts/fixtures/release-delivery/portable/portable.yaml
  SITE_ROOT: ./scripts/fixtures/release-delivery/portable
  ZELLIJ_IMAGE: ghcr.io/mylife-inc/zellij-base:0.2.0-rc.5
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - env:
        ZEL_INSTALL_DIR: ${{ runner.temp }}/zel-bin
        ZEL_VERSION: v0.2.0-rc.5
      name: Install pinned zel
      run: |
        set -eu
        base="https://github.com/mylife-inc/releases/releases/download/zellij-$ZEL_VERSION"
        curl --fail --silent --show-error --location "$base/install.sh" --output "$RUNNER_TEMP/zel-install.sh" || { echo 'The pinned zel release must be published before this workflow can run.' >&2; exit 1; }
        sh "$RUNNER_TEMP/zel-install.sh"
        printf '%s\n' "$ZEL_INSTALL_DIR" >> "$GITHUB_PATH"
    - name: Validate documentation
      run: zel check --config "$SITE_CONFIG" --strict --deep
    - name: Build without publishing
      run: zel build --config "$SITE_CONFIG" --out "$RUNNER_TEMP/zellij-site"
    timeout-minutes: 30
name: Documentation (acceptance-portable.yml)
on:
  pull_request:
    paths:
    - scripts/fixtures/release-delivery/portable/**
    - .github/workflows/acceptance-portable.yml
  workflow_dispatch: {}
permissions:
  contents: read
