name: Book PDF acceptance
on:
  workflow_call:
  workflow_dispatch:
jobs:
  pdf:
    name: LuaLaTeX (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo build --locked -p zellij-cli
        working-directory: cli
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils qpdf
      - name: Generate and inspect a complete PDF book
        env:
          DOCKER_CONTEXT: default
        run: node scripts/check-pdf.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: book-pdf-${{ matrix.runner }}
          path: test-results/pdf
          if-no-files-found: warn
