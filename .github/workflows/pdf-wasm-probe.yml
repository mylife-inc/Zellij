name: Cached PDF feasibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .gitattributes
      - .github/workflows/pdf-wasm-probe.yml
      - scripts/pdf-wasm/**
      - cli/crates/zellij-docs/examples/pdf_probe_inputs.rs
      - cli/crates/zellij-core/src/process.rs
      - cli/crates/zellij-core/src/process/**
      - cli/crates/zellij-engine/src/pdf_runner.rs
      - cli/crates/zellij-engine/examples/pdf_process.rs
      - cli/crates/zellij-cli/examples/pdf_cache.rs
      - cli/crates/zellij-cli/src/pdf_package.rs
      - cli/crates/zellij-cli/src/pdf.rs
      - cli/crates/zellij-cli/src/args.rs
      - cli/crates/zellij-cli/src/main.rs
      - cli/crates/zellij-cli/src/preview.rs
      - cli/crates/zellij-cli/src/doctor.rs
      - cli/crates/zellij-cli/src/rich_build/**
      - cli/crates/zellij-cli/src/rich_build.rs
      - cli/crates/zellij-cli/src/package_transfer.rs
      - cli/crates/zellij-cli/src/user_home.rs
      - cli/crates/zellij-docs/src/pdf.rs
      - cli/crates/zellij-docs/assets/book*.tex
      - scripts/fixtures/long-book.mjs
      - scripts/fixtures/pdf-book/**
      - scripts/fixtures/install-cached-renderer.mjs
      - scripts/fixtures/build-cached-engine.mjs
permissions:
  contents: read
jobs:
  probe:
    name: Offline LuaHBTeX (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    # Includes cold Rust compilation, complete source packaging and installed CLI tests.
    # Compiler pass/total and cancellation deadlines remain independently tested.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest, windows-11-arm]
    env:
      ZEL_PDF_PROBE_BUNDLE: ${{ github.workspace }}/test-results/pdf-wasm-bundle
      ZEL_PDF_FORMAT_INPUTS: ${{ github.workspace }}/test-results/pdf-format-inputs
      ZEL_PDF_FONT_INPUTS: ${{ github.workspace }}/test-results/pdf-font-inputs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: cargo build --locked -p zellij-cli
        working-directory: cli
      - run: cargo build --locked -p zellij-docs --example pdf_probe_inputs
        working-directory: cli
      - run: cargo build --locked -p zellij-engine --example pdf_process
        working-directory: cli
      - run: cargo test --locked -p zellij-cli --example pdf_cache
        working-directory: cli
      - run: cargo build --locked -p zellij-cli --example pdf_cache
        working-directory: cli
      - run: node --test scripts/pdf-wasm/download.test.mjs
      - name: Prepare unchanged original resources from their pinned archives
        shell: bash
        run: python scripts/pdf-wasm/originals.py "$RUNNER_TEMP/pdf-format-sources" test-results/pdf-originals
      - name: Fetch the pinned feasibility inputs (not release assets)
        shell: bash
        run: node scripts/pdf-wasm/download.mjs "$ZEL_PDF_PROBE_BUNDLE" test-results/pdf-originals
      - run: node --test scripts/pdf-wasm/probe.test.mjs
      - run: node --test scripts/pdf-wasm/originals.test.mjs
      - name: Prepare the original format sources and notices
        shell: bash
        run: |
          python scripts/pdf-wasm/format_sources.py fetch "$RUNNER_TEMP/pdf-format-sources"
          python scripts/pdf-wasm/format_sources.py prepare "$RUNNER_TEMP/pdf-format-sources" "$ZEL_PDF_FORMAT_INPUTS"
      - name: Rebuild INITEX twice without the old format or generated metadata
        shell: bash
        run: node scripts/pdf-wasm/format.mjs "$ZEL_PDF_PROBE_BUNDLE" "$ZEL_PDF_FORMAT_INPUTS" test-results/pdf-format
      - run: node --test scripts/pdf-wasm/format.test.mjs
      - name: Prepare the original font generator, Unicode data and selected fonts
        shell: bash
        run: |
          python scripts/pdf-wasm/font_sources.py fetch "$RUNNER_TEMP/pdf-format-sources"
          python scripts/pdf-wasm/font_sources.py prepare "$RUNNER_TEMP/pdf-format-sources" "$ZEL_PDF_FONT_INPUTS"
      - name: Build compact font metadata twice using only the verified Wasm engine
        shell: bash
        run: node scripts/pdf-wasm/fonts.mjs "$ZEL_PDF_PROBE_BUNDLE" "$ZEL_PDF_FONT_INPUTS" test-results/pdf-font-metadata
      - run: node --test scripts/pdf-wasm/fonts.test.mjs
      - name: Assemble the experimental resource archive without upstream generated data
        shell: bash
        run: python scripts/pdf-wasm/compact.py "$ZEL_PDF_PROBE_BUNDLE" test-results/pdf-format test-results/pdf-font-metadata test-results/pdf-compact
      - run: node --test scripts/pdf-wasm/compact.test.mjs
        env:
          ZEL_PDF_COMPACT_PACKAGE: test-results/pdf-compact/package
          ZEL_PDF_REBUILT_FORMAT: test-results/pdf-format/zellij-lualatex.fmt
          ZEL_PDF_FONT_METADATA: test-results/pdf-font-metadata
      - name: Qualify process cancellation, parent shutdown, crashes and preservation
        run: node --test scripts/pdf-wasm/process.test.mjs
        env:
          ZEL_PDF_COMPACT_PACKAGE: test-results/pdf-compact/package
      - name: Exercise the Rust owner with the real compiler and malformed protocol/artifacts
        run: node --test scripts/pdf-wasm/rust-process.test.mjs
        env:
          ZEL_PDF_COMPACT_PACKAGE: test-results/pdf-compact/package
      - name: Bind the versioned qualification package to exact original sources and notices
        shell: bash
        run: |
          python scripts/pdf-wasm/sources.py fetch "$RUNNER_TEMP/pdf-format-sources"
          python scripts/pdf-wasm/distribution.py "$RUNNER_TEMP/pdf-format-sources" test-results/pdf-toolchain-distribution
          version=$(python -c "import tomllib; print(tomllib.load(open('cli/Cargo.toml', 'rb'))['workspace']['package']['version'])")
          python scripts/pdf-wasm/toolchain.py test-results/pdf-compact/package test-results/pdf-toolchain-distribution test-results/pdf-toolchain --version "$version"
      - name: Download, verify, cache and run the real package with an empty system PATH
        run: node --test scripts/pdf-wasm/cache.test.mjs
      - name: Exercise installed CLI PDF commands and offline watched previews
        run: node --test scripts/pdf-wasm/installed.test.mjs
      - name: Install maintainer PDF comparison tools
        if: matrix.runner == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils qpdf
      - run: node scripts/pdf-wasm/check.mjs
        env:
          ZEL_PDF_PROBE_BASELINE: ${{ matrix.runner == 'ubuntu-latest' && '1' || '' }}
          ZEL_PDF_PROBE_BUNDLE: ${{ github.workspace }}/test-results/pdf-compact/package
          ZEL_PDF_RUST_SUPERVISOR: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-wasm-probe-${{ matrix.runner }}
          path: test-results/pdf-wasm
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-format-receipts-${{ matrix.runner }}
          path: |
            test-results/pdf-format/verification.json
            test-results/pdf-format-inputs/verification.json
            test-results/pdf-font-inputs/verification.json
            test-results/pdf-font-metadata/verification.json
            test-results/pdf-compact/verification.json
            test-results/pdf-originals/verification.json
            test-results/pdf-toolchain/verification.json
            test-results/pdf-cache/verification.json
            test-results/pdf-installed/verification.json
          if-no-files-found: error
          retention-days: 14
      # Never upload the engine/resource bundle before redistribution review.

  sources:
    name: PDF source correspondence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check source-verifier failure cases
        run: python -m unittest discover -s scripts/pdf-wasm -p 'test_*.py' -v
      - name: Download pinned source inputs (maintainer only)
        run: python scripts/pdf-wasm/sources.py fetch "${{ runner.temp }}/pdf-source-cache"
      - name: Verify original package bytes and collect notices
        run: python scripts/pdf-wasm/sources.py verify "${{ runner.temp }}/pdf-source-cache" test-results/pdf-source-verification
      - name: Complete the original format and font source cache
        run: |
          python scripts/pdf-wasm/format_sources.py fetch "${{ runner.temp }}/pdf-source-cache"
          python scripts/pdf-wasm/font_sources.py fetch "${{ runner.temp }}/pdf-source-cache"
      - name: Package original notices and self-contained sources (private qualification only)
        run: python scripts/pdf-wasm/distribution.py "${{ runner.temp }}/pdf-source-cache" test-results/pdf-source-distribution
      - name: Replay source checks using only the packaged programs and upstream files
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          root="$PWD/test-results/pdf-source-distribution/sources"
          python "$root/scripts/pdf-wasm/sources.py" verify "$root/upstream" test-results/pdf-distribution-replay/runtime
          python "$root/scripts/pdf-wasm/format_sources.py" prepare "$root/upstream" test-results/pdf-distribution-replay/format-inputs
          python "$root/scripts/pdf-wasm/font_sources.py" prepare "$root/upstream" test-results/pdf-distribution-replay/font-inputs
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-source-correspondence
          path: test-results/pdf-source-verification/verification.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-distribution-receipt
          path: test-results/pdf-source-distribution/verification.json
          if-no-files-found: error
          retention-days: 14
      # Keep source archives, notices and engine/data binaries out of artifacts.

  package-parity:
    name: PDF package and source parity
    needs: [probe, sources]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
      - uses: actions/download-artifact@v8
        with:
          pattern: pdf-format-receipts-*
          path: test-results/pdf-package-receipts
      - uses: actions/download-artifact@v8
        with:
          name: pdf-distribution-receipt
          path: test-results/pdf-package-source-receipt
      - run: node scripts/pdf-wasm/receipts.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-package-parity
          path: test-results/pdf-package-parity.json
          if-no-files-found: error
          retention-days: 14
