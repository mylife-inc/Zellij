name: Published WinGet acceptance
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published candidate matching the selected source version
        type: string
        required: true
        default: v0.2.0-rc.15
permissions:
  contents: read
jobs:
  install:
    name: Public WinGet (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, target: x86_64-pc-windows-msvc}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc}
    env:
      VERSION: ${{ inputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify public archives and the exact published manifest bundle
        run: node scripts/fetch-winget-release.mjs "$env:VERSION" dist
      - name: Provision checksum-pinned Microsoft WinGet
        shell: powershell
        run: .\scripts\prepare-winget.ps1
      - name: Install and upgrade directly from public HTTPS URLs
        env:
          ZEL_WINGET_PUBLIC: 'true'
          ZEL_WINGET_BINARY_RUN: public-release
          ZEL_WINGET_RECEIPT: ${{ runner.temp }}/winget-evidence/receipt.json
        run: node scripts/check-winget.mjs dist
      - name: Retain lifecycle receipt and WinGet diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-winget-${{ matrix.target }}
          path: ${{ runner.temp }}/winget-evidence/
          if-no-files-found: warn
          retention-days: 14
