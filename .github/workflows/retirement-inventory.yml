name: Zellij distribution inventory and retirement

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read inventory, review or verify rc.16–rc.18, or use the frozen rc.12 executor
        type: choice
        options: [inventory, review, verify-retained, retire-images]
        default: inventory
      plan_sha256:
        description: Exact SHA256 of the committed retirement plan (required for deletion)
        type: string
        default: ''

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: zellij-distribution-retirement
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'mylife-inc/Zellij' && inputs.mode != 'retire-images'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check exact-scope deletion safeguards
        run: node --test scripts/retire-release-images.test.mjs scripts/review-release-retention.test.mjs scripts/retire-reviewed-distributions.test.mjs
      - name: Check native release deletion safeguards without networking
        run: python3 scripts/retire-native-releases.test.py specs/evidence/zellij-rc15-native-retirement-plan-2026-11-20.json
      - name: List exact Zellij release and image version identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/inspect-release-inventory.mjs "$RUNNER_TEMP/retirement-inventory.json"
      - name: Review exact superseded releases and manifest dependencies without deleting
        if: inputs.mode == 'review'
        run: node scripts/review-release-retention.mjs "$RUNNER_TEMP/retirement-inventory.json" "$RUNNER_TEMP/retention-review.json"
      - name: Check the execution plan without deleting
        if: inputs.mode == 'review' || inputs.mode == 'verify-retained'
        env:
          GH_TOKEN: ${{ github.token }}
          RETENTION_MODE: ${{ inputs.mode }}
        run: |
          plan=specs/evidence/zellij-rc16-rc18-execution-plan-2026-11-26.json
          RETIRE_PLAN_SHA256="$(sha256sum "$plan" | cut -d ' ' -f1)"
          export RETIRE_PLAN_SHA256
          mode=preflight
          if [ "$RETENTION_MODE" = verify-retained ]; then mode=verify; fi
          node scripts/retire-reviewed-distributions.mjs "$mode" "$plan" "$RUNNER_TEMP/retention-check.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retirement-inventory
          path: |
            ${{ runner.temp }}/retirement-inventory.json
            ${{ runner.temp }}/retention-review.json
            ${{ runner.temp }}/retention-check.json
          if-no-files-found: error
          retention-days: 7
  retire-images:
    # Historical, exact rc.12-only executor. It cannot accept the schema-2
    # read-only review above; a new cleanup requires new tested execution guards.
    if: github.repository == 'mylife-inc/Zellij' && startsWith(github.ref, 'refs/heads/') && inputs.mode == 'retire-images'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check exact-scope deletion safeguards
        run: node --test scripts/retire-release-images.test.mjs
      - name: Retire reviewed old image versions and preserve current dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          RETIRE_PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: node scripts/retire-release-images.mjs apply specs/evidence/zellij-rc15-image-retirement-plan-2026-11-20.json "$RUNNER_TEMP/image-retirement.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: image-retirement
          path: ${{ runner.temp }}/image-retirement.json
          if-no-files-found: error
          retention-days: 7
