        sh "$RUNNER_TEMP/zel-install.sh"
        printf '%s\n' "$ZEL_INSTALL_DIR" >> "$GITHUB_PATH"
    - name: Check the configured Docker runtime
      run: |
        timeout --kill-after=5s 60s docker info || { echo 'The configured Docker runtime is unavailable. Check the runner daemon and endpoint; no alternate runtime was selected.' >&2; exit 1; }
