name: Browser resize investigation
on:
  push:
    branches: [codex/browser-resize-investigation]
permissions:
  contents: read
  actions: read
jobs:
  report:
    name: Verify retained browser outcome summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test scripts/report-browser-results.test.mjs
      - uses: actions/download-artifact@v8
        with:
          name: resize-header-sequence
          run-id: 46063731462
          github-token: ${{ github.token }}
          path: timing-input
      - name: Summarize the actual completed header results
        run: |
          node scripts/report-browser-results.mjs timing-input/timing-results/results.json
          cp "$GITHUB_STEP_SUMMARY" timing-summary.md
          sha256sum scripts/report-browser-results.mjs scripts/report-browser-results.test.mjs > source-hashes.txt
      - uses: actions/upload-artifact@v7
        with:
          name: browser-summary-verification
          path: |
            timing-summary.md
            source-hashes.txt
            timing-input/timing-results/results.json
          retention-days: 14
          if-no-files-found: error
