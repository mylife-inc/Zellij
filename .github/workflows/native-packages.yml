name: Native packages

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: workspace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and install (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: release-${{ matrix.target }}
      - name: Build the exact release archive and checksum
        env:
          VERSION: ${{ inputs.version || 'workspace' }}
          TARGET: ${{ matrix.target }}
        run: node scripts/package-native.mjs "$env:VERSION" "$env:TARGET" dist
        shell: pwsh
        if: runner.os == 'Windows'
      - name: Build the exact release archive and checksum
        env:
          VERSION: ${{ inputs.version || 'workspace' }}
          TARGET: ${{ matrix.target }}
        run: node scripts/package-native.mjs "$VERSION" "$TARGET" dist
        if: runner.os != 'Windows'
      - name: Install downloaded archives and exercise the installed binary
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/check-native-install.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
