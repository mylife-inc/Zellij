name: Native packages

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: workspace
      probe:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      probe:
        description: Run focused Windows first-page diagnostics
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  renderer:
    name: Compile shared rich renderer
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compile the shared rich renderer once for all platforms
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run build --workspace @shebka/zellij
          node scripts/build-standalone-engine.mjs
          node scripts/package-editable-sources.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: standalone-engine
          path: dist/standalone-engine/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: editable-sources
          path: dist/source-packages/*
          if-no-files-found: error
          retention-days: 14

  package:
    if: ${{ !inputs.probe }}
    name: Package and install (${{ matrix.target }})
    needs: renderer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: release-${{ matrix.target }}
          cache-on-failure: true
      - name: Build the exact release archive and checksum
        env:
          VERSION: ${{ inputs.version || 'workspace' }}
          TARGET: ${{ matrix.target }}
        run: node scripts/package-native.mjs "$env:VERSION" "$env:TARGET" dist
        shell: pwsh
        if: runner.os == 'Windows'
      - name: Build the exact release archive and checksum
        env:
          VERSION: ${{ inputs.version || 'workspace' }}
          TARGET: ${{ matrix.target }}
        run: node scripts/package-native.mjs "$VERSION" "$TARGET" dist
        if: runner.os != 'Windows'
      - name: Install downloaded archives and exercise the installed binary
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/check-native-install.mjs
      - name: Windows upgrade ownership, lock recovery and preservation
        if: runner.os == 'Windows'
        run: cargo test --manifest-path cli/Cargo.toml --locked --release --target '${{ matrix.target }}' -p zellij-cli --bin zel maintenance::upgrade
      - uses: actions/download-artifact@v8
        with:
          name: standalone-engine
          path: dist/standalone-engine
      - name: Package the private runtime and verify tool-free builds
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          case "$TARGET" in
            x86_64-apple-darwin) platform=darwin-x64 ;;
            aarch64-apple-darwin) platform=darwin-arm64 ;;
            x86_64-unknown-linux-gnu) platform=linux-x64 ;;
            aarch64-unknown-linux-gnu) platform=linux-arm64 ;;
            x86_64-pc-windows-msvc) platform=win-x64 ;;
            aarch64-pc-windows-msvc) platform=win-arm64 ;;
          esac
          node scripts/package-standalone-engine.mjs "$platform"
          binary="cli/target/$TARGET/release/zel"
          case "$TARGET" in *-windows-msvc) binary="$binary.exe" ;; esac
          node scripts/check-standalone-engine.mjs "$binary"
      - uses: actions/download-artifact@v8
        with:
          name: editable-sources
          path: dist/source-packages
      - name: Package cached Next development dependencies
        shell: bash
        run: |
          node scripts/development-runtime/prepare.mjs --check
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/development-runtime
          node scripts/package-development.mjs
      - name: Cached Next development with an empty system PATH
        env:
          TARGET: ${{ matrix.target }}
          ZEL_DEV_BROWSER: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'true' || 'false' }}
        shell: bash
        run: |
          binary="cli/target/$TARGET/release/zel"
          case "$TARGET" in *-windows-msvc) binary="$binary.exe" ;; esac
          if [ "$ZEL_DEV_BROWSER" = true ]; then
            npm ci
            npm run build --workspace @shebka/zellij
            npx playwright install --with-deps chromium
          fi
          node scripts/check-cached-development.mjs "$binary"
      - name: Cached editable sources and installed Next wrapper
        env:
          TARGET: ${{ matrix.target }}
          ZEL_SOURCE_BUILD: 'true'
        shell: bash
        run: |
          binary="cli/target/$TARGET/release/zel"
          case "$TARGET" in *-windows-msvc) binary="$binary.exe" ;; esac
          node scripts/check-editable-sources.mjs "$binary"
      - uses: actions/upload-artifact@v7
        with:
          name: development-${{ matrix.target }}
          path: dist/development-packages/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: renderer-${{ matrix.target }}
          path: dist/renderer-packages/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/zel-v*
          if-no-files-found: error
          retention-days: 14

  probe:
    name: Windows first-page probe (${{ matrix.features }}, ${{ matrix.paths }})
    if: ${{ inputs.probe }}
    needs: renderer
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { features: none, paths: unicode, plain: 'false' }
          - { features: all, paths: unicode, plain: 'false' }
          - { features: all, paths: plain, plain: 'true' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: release-x86_64-pc-windows-msvc
          cache-on-failure: true
      - run: node scripts/package-native.mjs workspace x86_64-pc-windows-msvc dist
      - uses: actions/download-artifact@v8
        with:
          name: standalone-engine
          path: dist/standalone-engine
      - uses: actions/download-artifact@v8
        with:
          name: editable-sources
          path: dist/source-packages
      - name: Prepare verified diagnostic packages
        shell: bash
        run: |
          node scripts/package-standalone-engine.mjs win-x64
          node scripts/development-runtime/prepare.mjs --check
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/development-runtime
          node scripts/package-development.mjs
      - name: Observe one uninterrupted first-page request
        env:
          ZEL_DEV_PROBE: 'true'
          ZEL_DEV_PROBE_FEATURES: ${{ matrix.features }}
          ZEL_DEV_PROBE_PLAIN: ${{ matrix.plain }}
        run: node scripts/check-cached-development.mjs cli/target/x86_64-pc-windows-msvc/release/zel.exe
