name: Browser rendering reduction
on:
  push:
    branches: [codex/browser-rendering-reduction]
permissions:
  contents: read
jobs:
  reduction:
    name: Overflow commit-order regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @shebka/zellij
      - run: npm run build --workspace @shebka/zellij-showcase
      - run: npx playwright install --with-deps chromium webkit
      - name: Reproduce the observed callback order without retries
        shell: bash
        working-directory: examples/showcase
        env:
          DEBUG: pw:browser
        run: |
          mkdir -p reduction-results
          PLAYWRIGHT_JSON_OUTPUT_FILE=reduction-results/results.json npx playwright test e2e/header-layout.spec.ts --grep 'preserves the latest overflow request' --project desktop --project desktop-safari --workers 2 --repeat-each 2 --retries 0 --reporter=line,json 2>&1 | tee reduction-results/browser.log
      - name: Retain structured outcomes
        if: always() && hashFiles('examples/showcase/reduction-results/results.json') != ''
        run: node scripts/report-browser-results.mjs examples/showcase/reduction-results/results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-rendering-reduction
          path: |
            examples/showcase/reduction-results/
            examples/showcase/test-results/
          retention-days: 14
          if-no-files-found: error
