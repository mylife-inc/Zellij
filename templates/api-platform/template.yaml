schema: 1
id: api-platform
version: 0.1.0
title: API platform
description: A Kie-inspired platform website with blue light, expressive typography, model cards and a practical guide.
minimum-cli: 0.2.0-rc.10
minimum-engine: 0.2.0-rc.10
renderer: hosted
kind: site
outputs: [web]
variables:
  title: Prism
substitute:
  - content/site.yaml
  - content/pages.yaml
assets:
  - {path: content/assets/frame.svg, license: LicenseRef-Zellij}
  - {path: content/assets/motion.svg, license: LicenseRef-Zellij}
  - {path: content/assets/sound.svg, license: LicenseRef-Zellij}
preview: content/assets/frame.svg
