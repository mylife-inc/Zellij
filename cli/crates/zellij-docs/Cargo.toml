[package]
name = "zellij-docs"
description = "Portable Markdown documentation, rendered without a server or JavaScript runtime."
version.workspace = true
edition.workspace = true
rust-version = "1.96"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
zellij-core.workspace = true
camino.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
walkdir.workspace = true
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
math-core = "=0.9.0"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mime_guess = "2"

[dev-dependencies]
tempfile = "3"
