[package]
name = "zellij-docs"
description = "Portable Markdown documentation, rendered without a server or JavaScript runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
zellij-core.workspace = true
camino.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
walkdir.workspace = true
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }

[dev-dependencies]
tempfile = "3"
