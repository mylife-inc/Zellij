[package]
name = "zellij-cli"
description = "The Zellij command line."
version.workspace = true
edition.workspace = true
rust-version = "1.96"
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "zel"
path = "src/main.rs"

[dependencies]
zellij-core.workspace = true
zellij-convert.workspace = true
zellij-scaffold.workspace = true
zellij-engine.workspace = true
zellij-docs.workspace = true
camino.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha1 = "0.10"
sha2 = "0.10"
semver = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
walkdir.workspace = true
ctrlc = { version = "3.5", features = ["termination"] }
open = "5"
clap_complete = "4.6.11"
tempfile = "3"
pretty_yaml = "=0.6.0"
yaml_parser = "=0.3.0"
rowan = "0.16"
serde_yaml_ng.workspace = true
