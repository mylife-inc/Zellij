[package]
name = "zellij-cli"
description = "The Zellij command line."
version.workspace = true
edition.workspace = true
rust-version = "1.96"
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "zel"
path = "src/main.rs"

[dependencies]
zellij-core.workspace = true
zellij-convert.workspace = true
zellij-scaffold.workspace = true
zellij-engine.workspace = true
zellij-docs.workspace = true
camino.workspace = true
clap.workspace = true
serde_json.workspace = true
ctrlc = { version = "3.5", features = ["termination"] }
open = "5"

[dev-dependencies]
tempfile = "3"
